name: Promote INKSIDE verified candidate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-inkside.yml']

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: creator-platform
          fetch-depth: 0
      - name: Decode and verify candidate
        shell: bash
        run: |
          base64 -d creator-platform/run-11-candidate.html.gz.b64 | gunzip > creator-platform/index.html
          grep -qi 'Creator Studio' creator-platform/index.html
          grep -qi '90%' creator-platform/index.html
          grep -qi 'mature' creator-platform/index.html
          grep -qi 'analytics' creator-platform/index.html
          python -m http.server 4173 --directory creator-platform >/tmp/inkside-http.log 2>&1 &
          pid=$!
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          kill $pid
      - name: Promote verified build
        shell: bash
        run: |
          if git diff --quiet -- creator-platform/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add creator-platform/index.html
          git commit -m 'Promote verified INKSIDE run 11 build'
          git push origin HEAD:creator-platform
